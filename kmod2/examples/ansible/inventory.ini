# inventory.ini — the machines Ansible manages.  Edit the hostnames/IPs and the
# storage vars for your cluster.

[compute]
# Range syntax expands node001..node200 (zero-padded).  Or list IPs, one per line.
node[001:200].cluster.local

[compute:vars]
# --- storage server export (ciphertext) and where each node mounts things ---
enc_src = storage.cluster.local:/export/app.enc   # NFS export of the .enc tree
enc_mnt = /mnt/app.enc                             # where each node NFS-mounts it (ciphertext)
app_mnt = /opt/app                                 # where vcachefs presents it (decrypted)
ko_dest = /opt/vcachefs/vcachefs.ko                # local path for the module on each node

# If you don't use SSH keys yet, you can set (not recommended long-term):
# ansible_user = root
# ansible_ssh_pass = ...        # better: set up key-based SSH
