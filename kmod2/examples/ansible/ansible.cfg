# ansible.cfg — run ansible/ansible-playbook from this directory and it picks
# up this config + inventory automatically.
[defaults]
inventory            = inventory.ini
remote_user          = root          # or a login user that can sudo
host_key_checking    = False         # don't prompt on first SSH to each node
forks                = 50            # configure 50 nodes at a time (raise for speed)
retry_files_enabled  = False

[privilege_escalation]
become        = True                 # run tasks with sudo (insmod/mount need root)
become_method = sudo
